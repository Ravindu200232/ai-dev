name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          # package manager is ready
          npm ci
      - name: Build application
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/deployment_agent_build
          BETTER_AUTH_SECRET: build-only-placeholder-real-value-injected-at-runtime
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build
      - name: Dependency audit
        if: ${{ always() && hashFiles('package-lock.json') != '' }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Verify standalone output
        run: test -f .next/standalone/server.js
